<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#B9AA9C">
  <title>GodSlayersFC Bingo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sticky top navigation/banner -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="GodSlayersFC Bingo home">
        <span class="brand-mark">GS</span>
        <span>GodSlayersFC Bingo</span>
      </a>
      <div class="header-actions">
        <span id="syncStatus" class="sync-status">Loading…</span>
        
      </div>
    </div>
  </header>

  <!-- Main page content -->
  <main class="page-shell">
    <!-- Event title and configurable event information -->
    <section class="hero">
      <!-- Left side: event name and subtitle -->
      <div class="hero-left">
        <h1>GodSlayersFC Bingo</h1>
        <p class="hero-subtitle">Old School RuneScape Clan Event</p>
      </div>

      <!-- Right side: values loaded from bingo-data.js -->
      <div class="hero-right">
        <!-- Definition list keeps event labels aligned with their values -->
        <dl class="event-details">
          <div>
            <dt>Start Date:</dt>
            <dd id="startDate"></dd>
          </div>
          <div>
            <dt>End Date:</dt>
            <dd id="endDate"></dd>
          </div>
          <div>
            <dt>Prize:</dt>
            <dd id="prize"></dd>
          </div>
          <div>
            <dt>Submission rules:</dt>
            <dd id="submissionRules"></dd>
          </div>
        </dl>
      </div>
    </section>

    <!-- Bingo board area -->
    <section class="board-panel" aria-labelledby="boardHeading">

      <!-- Both team boards displayed at the same time -->
      <div class="side-by-side-boards">
        <!-- First team board -->
        <section class="team-column" aria-labelledby="teamOneHeading">
          <div class="team-column-heading">
            <h3 id="teamOneHeading">Team Saradomin</h3>
          </div>
          <div id="board-teamOne" class="bingo-board compact-board" aria-label="Team Saradomin bingo board"></div>
        </section>

        <!-- Second team board -->
        <section class="team-column" aria-labelledby="teamTwoHeading">
          <div class="team-column-heading">
            <h3 id="teamTwoHeading">Team Zamorak</h3>
          </div>
          <div id="board-teamTwo" class="bingo-board compact-board" aria-label="Team Zamorak bingo board"></div>
        </section>
      </div>
      </div>
    </section>
  </main>

  <!-- Expanded tile details modal -->
  <dialog id="tileDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <!-- Large image shown in the expanded tile -->
      <img id="dialogImage" class="dialog-image" alt="">
      <!-- Expanded tile text and completion information -->
      <div class="dialog-content">
        <p id="dialogStatus" class="status-pill"></p>
        <h2 id="dialogTitle"></h2>
        <p id="dialogDescription"></p>
        <div id="dialogRequirementsWrap">
          <h3>Completion requirements</h3>
          <p id="dialogRequirements"></p>
        </div>
        <div id="dialogCompletedByWrap" class="hidden">
          <h3>Completed by</h3>
          <p id="dialogCompletedBy"></p>
        </div>
        
      </div>
    </form>
  </dialog>

  <!-- Reusable HTML template cloned once for every bingo tile -->
  <template id="tileTemplate">
    <button class="bingo-tile" type="button">
      <span class="tile-image-wrap">
        <img class="tile-image" alt="">
        <span class="completion-check" aria-hidden="true">✓</span>
      </span>
      <span class="tile-title"></span>
      <span class="tile-number"></span>
    </button>
  </template>

  <!-- Main JavaScript module -->
  <script type="module" src="app.js"></script>
</body>
</html>
