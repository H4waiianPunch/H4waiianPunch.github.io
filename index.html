<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202124">
  <title>GodSlayersFC Bingo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="GodSlayersFC Bingo home">
        <span class="brand-mark">GS</span>
        <span>GodSlayersFC Bingo</span>
      </a>
      <div class="header-actions">
        <span id="syncStatus" class="sync-status">Loading…</span>
        
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">Old School RuneScape Clan Event</p>
      <h1>GodSlayersFC Bingo</h1>
      <div id="announcement" class="announcement" aria-live="polite"></div>
      
    </section>

    <section class="board-panel" aria-labelledby="boardHeading">
<div class="legend">
          <span><span class="legend-dot"></span> Incomplete</span>
          <span><span class="legend-dot complete"></span> Complete</span>
        </div>
      </div>

      <div class="side-by-side-boards">
        <section class="team-column" aria-labelledby="teamOneHeading">
          <div class="team-column-heading">
            <h3 id="teamOneHeading">Team Saradomin</h3>
          </div>
          <div id="board-teamOne" class="bingo-board compact-board" aria-label="Team Saradomin bingo board"></div>
        </section>

        <section class="team-column" aria-labelledby="teamTwoHeading">
          <div class="team-column-heading">
            <h3 id="teamTwoHeading">Team Zamorak</h3>
          </div>
          <div id="board-teamTwo" class="bingo-board compact-board" aria-label="Team Zamorak bingo board"></div>
        </section>
      </div>
      </div>
    </section>
  </main>

  <dialog id="tileDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <img id="dialogImage" class="dialog-image" alt="">
      <div class="dialog-content">
        <p id="dialogStatus" class="status-pill"></p>
        <h2 id="dialogTitle"></h2>
        <p id="dialogDescription"></p>
        <div id="dialogRequirementsWrap">
          <h3>Completion requirements</h3>
          <p id="dialogRequirements"></p>
        </div>
        <div id="dialogCompletedByWrap" class="hidden">
          <h3>Completed by</h3>
          <p id="dialogCompletedBy"></p>
        </div>
        
      </div>
    </form>
  </dialog>

  <template id="tileTemplate">
    <button class="bingo-tile" type="button">
      <span class="tile-image-wrap">
        <img class="tile-image" alt="">
        <span class="completion-check" aria-hidden="true">✓</span>
      </span>
      <span class="tile-title"></span>
      <span class="tile-number"></span>
    </button>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
