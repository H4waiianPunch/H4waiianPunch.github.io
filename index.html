<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#B9AA9C">
  <title>GodSlayersFC Bingo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="GodSlayersFC Bingo home">
        <span class="brand-mark">GS</span>
        <span>GodSlayersFC Bingo</span>
      </a>
      <div class="header-actions">
        <span id="syncStatus" class="sync-status">Loading…</span>
        
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero">
      <div class="hero-left">
        <h1>GodSlayersFC Bingo</h1>
        <p class="hero-subtitle">Old School RuneScape Clan Event</p>
      </div>

      <div class="hero-right">
        <dl class="event-details">
          <div>
            <dt>Start Date:</dt>
            <dd id="startDate"></dd>
          </div>
          <div>
            <dt>End Date:</dt>
            <dd id="endDate"></dd>
          </div>
          <div>
            <dt>Prize:</dt>
            <dd id="prize"></dd>
          </div>
          <div>
            <dt>Submission rules:</dt>
            <dd id="submissionRules"></dd>
          </div>
        </dl>

        <a class="discord-button"
           href="https://discord.gg/KuyFX5y8vR"
           target="_blank"
           rel="noopener noreferrer">
          Return to Discord
        </a>
      </div>
    </section>

    <section class="board-panel" aria-labelledby="boardHeading">

      <div class="team-tabs" role="tablist" aria-label="Bingo teams">
        <button class="team-tab active" id="tab-team-one" role="tab"
          aria-selected="true" aria-controls="panel-team-one" data-team="teamOne">
          Team Saradomin
        </button>
        <button class="team-tab" id="tab-team-two" role="tab"
          aria-selected="false" aria-controls="panel-team-two" data-team="teamTwo">
          Team Zamorak
        </button>
      </div>

      <div id="panel-team-one" class="team-panel" role="tabpanel" aria-labelledby="tab-team-one">
        <div id="board-teamOne" class="bingo-board" aria-label="Team Saradomin bingo board"></div>
      </div>

      <div id="panel-team-two" class="team-panel hidden" role="tabpanel" aria-labelledby="tab-team-two">
        <div id="board-teamTwo" class="bingo-board" aria-label="Team Zamorak bingo board"></div>
      </div>
    </section>
  </main>

  <dialog id="tileDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <img id="dialogImage" class="dialog-image" alt="">
      <div class="dialog-content">
        <p id="dialogStatus" class="status-pill"></p>
        <h2 id="dialogTitle"></h2>
        <p id="dialogDescription"></p>
        <div id="dialogRequirementsWrap">
          <h3>Completion requirements</h3>
          <p id="dialogRequirements"></p>
        </div>
        <div id="dialogCompletedByWrap" class="hidden">
          <h3>Completed by</h3>
          <p id="dialogCompletedBy"></p>
        </div>
        
      </div>
    </form>
  </dialog>

  <template id="tileTemplate">
    <button class="bingo-tile" type="button">
      <span class="tile-image-wrap">
        <img class="tile-image" alt="">
        <span class="completion-check" aria-hidden="true">✓</span>
      </span>
      <span class="tile-title"></span>
      <span class="tile-number"></span>
    </button>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
